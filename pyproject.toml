[project]
name = "certgen"
version = "1.0.0"
description = "Bulk certificate generator with a two-ledger settlement model"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "reportlab>=4.0,<6",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
